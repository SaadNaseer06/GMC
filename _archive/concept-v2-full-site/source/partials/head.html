    <script>
      // Runs before the page paints. The intro loader shows on every page and
      // every reload, unless the visitor prefers reduced motion. "intro" stays
      // on to time the hero entrance after the loader exits.
      (function (d) {
        d.classList.replace('no-js', 'js');
        try {
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
            d.classList.add('has-loader', 'intro');
          }
        } catch (e) {}
      })(document.documentElement);
    </script>
    <style>
      /* First-paint safety: the page ground and the loader exist before the
         stylesheet arrives, so nothing unstyled ever flashes. */
      html, body { margin: 0; background: #0b2e32; }
      .loader { display: none; }
      html.has-loader .loader {
        position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
        background: #061f23;
      }
      .loader__logo { width: min(286px, 74vw); height: auto; opacity: 0; }
    </style>
